name: Trade Saathi CI

on:
  push:
    paths: ['trade-saathi/**', '.github/workflows/trade-saathi-ci.yml']
  pull_request:
    paths: ['trade-saathi/**']

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: trade-saathi
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm, cache-dependency-path: trade-saathi/package-lock.json }
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npx vite build
      - run: npx playwright install --with-deps chromium
      - run: echo "CRON_SECRET=ci" > .dev.vars && npx playwright test
